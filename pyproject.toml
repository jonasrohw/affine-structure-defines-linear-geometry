[project]
name = "affine-structure-defines-linear-geometry"
version = "0.2.0"
description = "Reproduce the experiments, analyses and figures of the factual recall paper."
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "torch==2.12.0",
    "matplotlib==3.11.0",
    "pandas==3.0.3",
    "cairosvg==2.8.2",
]

[dependency-groups]
dev = ["pytest==9.1.0", "ruff==0.15.0"]

[project.scripts]
reproduce = "factual_recall.reproduce:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments/factual_recall"]

[tool.pytest.ini_options]
testpaths = ["experiments/tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
