# Direct ablation of the selected width-52 model: standard phase-1 pretraining,
# followed by full fine-tuning with entity embeddings left trainable.  Attribute
# sentences are rehearsed during relation training to make retention measurable
# without making embedding freezing the preservation mechanism.

[experiment]
n_entities = 64
n_attributes = 10
embedding_dim = 10
nonlinear_width = 52
nonlinear_depth = 2
relation_embedding_dim = 8
positive_fraction = 0.1
batch_size = 1024
phase1_steps = 2500
arbitrary_steps = 5000
joint_steps = 6000
learning_rate = 0.003
attr_loss_weight = 1.0
freeze_embeddings = false
relation_attr_rehearsal_weight = 1.0
run_joint_on_stage_failure = true
nonlinear_base_penalty = 0.1
eval_every = 100
target_accuracy = 0.995
ols_folds = 4
graph_swaps_per_edge = 40
output_dir = "factual_recall/results/symmetric_lookup_unfrozen"

[sweep]
seeds = [19, 31, 47]
embedding_dims = [10]
nonlinear_widths = [40, 48, 52, 56, 64]
nonlinear_depths = [2]
min_structured_ols_r2 = 0.95
max_arbitrary_ols_r2 = 0.50
max_arbitrary_affine_accuracy = 0.90
require_all_seeds = true
