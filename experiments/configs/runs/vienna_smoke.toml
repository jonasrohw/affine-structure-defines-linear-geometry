seed = 42

[dataset]
name = "vienna_filler"
n_subjects = 12
n_objects = 12
n_train_pairs = 12

[model]
size = "tiny"
context_len = 32

[training]
num_sequences = 8
seq_length = 28
batch_size = 4
max_epochs = 1
learning_rate = 0.001
weight_decay = 0.0
warmup_steps = 1
grad_clip = 1.0
eval_every = 1
checkpoint_dir = "/tmp/factual_recall_smoke_checkpoints"
results_dir = "/tmp/factual_recall_smoke_results"
