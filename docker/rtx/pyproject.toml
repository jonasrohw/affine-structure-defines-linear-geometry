[project]
name = "affine-structure-defines-linear-geometry"
version = "0.1.0"
description = "Synthetic factual recall experiments with configurable datasets and transformer sizes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
plots = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
factual-recall = "factual_recall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factual_recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
